server:
  port: 8080

spring:
  graphql:
    graphiql:
      enabled: false
    path: /graphql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: lms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

lms:
  db:
    host: localhost
    port: 5433
    username: lms
    password: lms
  auth:
    jwt-secret: lms-lab-jwt-secret-key-32bytes!!
    session-ttl: 2h
  grpc:
    identity: localhost:9101
    catalog: localhost:9102
    enrollment: localhost:9103
